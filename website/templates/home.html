<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{title}}</title>
</head>
<body>
<div class="features-container">
    {% for feature in features %}
        <div class="feature-card">
       
            <span class="icon">{{ feature.icon }}</span>
            <h3>{{ feature.title }}</h3>
            <p>{{ feature.description }}</p>
        </div>
    {% endfor %}
</div>

</body>
</html>
