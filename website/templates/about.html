<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{title}}</title>
</head>
<body>

<h1>{{ title }}</h1>
<p>Address: {{ address }}</p>
<p>Year: {{ founded_year }}</p>

{% if is_open_now %}
    <p>We are open!</p>
{% else %}
    <p>We are closed.</p>
{% endif %}


<h3>Our Services:</h3>
<ul>
    {% for service in services %}
        <li>{{ service }}</li>
    {% endfor %}
</ul>

    
</body>
</html>
