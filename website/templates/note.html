<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Miss's Todo List Details</title>
    <style>
        body { font-family: sans-serif; margin: 40px; background-color: #f9f9f9; }
        .form-container { background: white; margin-bottom: 30px; padding: 20px; border: 1px solid #ddd; max-width: 400px; border-radius: 6px; }
        label { font-weight: bold; display: block; margin-bottom: 5px; }
        input, textarea { width: 100%; margin-bottom: 15px; padding: 8px; box-sizing: border-box; }
        button { padding: 10px 15px; background: #007bff; color: white; border: none; cursor: pointer; font-weight: bold; border-radius: 4px; }
        button:hover { background: #0056b3; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: white; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
        th { background-color: #f4f4f4; }
    </style>
</head>
<body>

    <h1>Miss's Todo List Details</h1>

    <!-- FORM FOR POST REQUEST -->
    <div class="form-container">
        <h3>Create a New Task</h3>
        <!-- action targets the unified 'todo_view' routing path -->
        <form method="POST" action="{% url 'todo_view' %}">
            {% csrf_token %} <!-- Essential security component for POST -->
            
            <label>Title:</label>
            <input type="text" name="title" required placeholder="Task Title...">
            
            <label>Content:</label>
            <textarea name="content" placeholder="Task Details..."></textarea>
            
            <button type="submit">Save Task</button>
        </form>
    </div>

    <!-- TABLE FOR DISPLAYING DATA FROM GET REQUEST -->
       <table>
        <thead>
            <tr>
                <th>Title</th>
                <th>Content</th>
                <th>Status</th>
                <th>Actions</th> <!-- 1. Add this heading line -->
            </tr>
        </thead>
        <tbody>
            {% for todo in todos %}
            <tr>
                <td><strong>{{ todo.title }}</strong></td>
                <td>{{ todo.content }}</td>
                <td>{% if todo.status %}✅ Done{% else %}❌ Pending{% endif %}</td>
                
                <!-- 2. Add this column block with the links right here -->
                <td>
                    <a href="{% url 'update_view' todo.id %}" style="margin-right: 10px; color: green; text-decoration: none; font-weight: bold;">Complete</a>
                    <a href="{% url 'delete_view' todo.id %}" style="color: red; text-decoration: none; font-weight: bold;">Delete</a>
                </td>
            </tr>
            {% empty %}
             <tr>
                <td colspan="4" style="text-align: center; color: #777;">
                    No tasks found. Try adding one above!
                </td>
            </tr>
            {% endfor %} <!-- 👈 MAKE SURE THIS IS RIGHT HERE -->
        </tbody>
    </table>



</body>
</html>
